name: Rust tests and native artifacts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --bins
      - run: git diff --check
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/native/bin
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          cp "target/release/pagy$suffix" "target/release/antigravity-region-fix$suffix" dist/native/bin/
          cp README.md README.ru.md LICENSE THIRD_PARTY_NOTICES.md TESTING.md install.sh install.ps1 dist/native/
          cp -R licenses dist/native/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: dist/native
