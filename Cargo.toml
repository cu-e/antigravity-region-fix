[package]
name = "antigravity-region-fix"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Experimental local eligibility patch manager and transparent agy launcher"

[dependencies]
anyhow = "1"
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"
dirs = "6"
walkdir = "2"
plist = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
